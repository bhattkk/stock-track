# Serves the static Vue app and proxies /api/* to the portfolio service, so
# the browser only ever talks to one origin (no CORS needed on the backend).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolving `portfolio` lazily (via a variable)
    # means nginx still starts when the portfolio container is down — the
    # front end then shows the 502 as an error instead of nothing loading.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $portfolio_upstream http://portfolio:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $portfolio_upstream;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
