# Serves the static Vue app, proxies /api/screener/* to the screener service,
# /api/analysis/* to the analysis service and every other /api/* to the
# portfolio service, so the browser only ever
# talks to one origin (no CORS needed on the backends).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolving `portfolio` lazily (via a variable)
    # means nginx still starts when the portfolio container is down — the
    # front end then shows the 502 as an error instead of nothing loading.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # The screener runs on demand (compose profile "screener"); while it's
    # stopped this returns 502 and the Screener tab says how to start it.
    location /api/screener/ {
        set $screener_upstream http://screener:8000;
        rewrite ^/api/screener/(.*)$ /$1 break;
        proxy_pass $screener_upstream;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
    }

    # Stage-1 technical analysis (always-on service with a weekly scheduler).
    location /api/analysis/ {
        set $analysis_upstream http://analysis:8000;
        rewrite ^/api/analysis/(.*)$ /$1 break;
        proxy_pass $analysis_upstream;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
    }

    location /api/ {
        set $portfolio_upstream http://portfolio:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $portfolio_upstream;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        # The static files are bind-mounted and edited in place: make the
        # browser revalidate every time (cheap 304s) so it never mixes a new
        # index.html with a stale cached app.js.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
