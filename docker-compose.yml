services:
  redis:
    image: redis:7-alpine
    container_name: stocktrack-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  market-data:
    build: ./market-data
    container_name: stocktrack-market-data
    env_file:
      - .env
    environment:
      # Override the Redis host so the service reaches the container, not localhost.
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: stocktrack-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portfolio}
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portfolio}"]
      interval: 5s
      timeout: 3s
      retries: 5

  portfolio:
    build: ./portfolio
    container_name: stocktrack-portfolio
    env_file:
      - .env
    environment:
      # Override host/port so the service reaches the containers, not localhost.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-portfolio}:${POSTGRES_PASSWORD:-portfolio}@postgres:5432/${POSTGRES_DB:-portfolio}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8001:8000"
    volumes:
      # Named volume, not bind mount, so backups survive a container recreate
      # but are still reachable on the host via `docker run --rm -v
      # stock-track_portfolio-backups:/backups ...` or `docker cp`.
      - portfolio-backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
  postgres-data:
  portfolio-backups:
