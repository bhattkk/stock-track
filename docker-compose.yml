services:
  redis:
    image: redis:7-alpine
    container_name: stocktrack-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  market-data:
    build: ./market-data
    container_name: stocktrack-market-data
    env_file:
      - .env
    environment:
      # Override the Redis host so the service reaches the container, not localhost.
      REDIS_URL: redis://redis:6379/0
      LOG_DIR: /app/logs
    volumes:
      # Bind mount (not a named volume) so logs land directly in ./logs on the host.
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: stocktrack-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portfolio}
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portfolio}"]
      interval: 5s
      timeout: 3s
      retries: 5

  portfolio:
    build: ./portfolio
    container_name: stocktrack-portfolio
    env_file:
      - .env
    environment:
      # Override host/port so the service reaches the containers, not localhost.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-portfolio}:${POSTGRES_PASSWORD:-portfolio}@postgres:5432/${POSTGRES_DB:-portfolio}
      REDIS_URL: redis://redis:6379/0
      LOG_DIR: /app/logs
    ports:
      - "8001:8000"
    volumes:
      # Named volume, not bind mount, so backups survive a container recreate
      # but are still reachable on the host via `docker run --rm -v
      # stock-track_portfolio-backups:/backups ...` or `docker cp`.
      - portfolio-backups:/backups
      # Bind mount (not a named volume) so logs land directly in ./logs on the host.
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # On-demand fundamentals screener: not started by a plain `docker compose up`.
  #   docker compose --profile screener up -d screener    # start
  #   docker compose stop screener                        # stop when done
  # Its data lives in Postgres (screener_* tables) and the raw-XBRL cache
  # volume, so nothing is lost while it's stopped.
  screener:
    build: ./screener
    container_name: stocktrack-screener
    profiles: ["screener"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-portfolio}:${POSTGRES_PASSWORD:-portfolio}@postgres:5432/${POSTGRES_DB:-portfolio}
      LOG_DIR: /app/logs
      RAW_DIR: /data/raw
    ports:
      - "8002:8000"
    volumes:
      - screener-raw:/data/raw
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  front-end:
    image: nginx:1.27-alpine
    container_name: stocktrack-front-end
    ports:
      - "8080:80"
    volumes:
      # Bind mounts so edits to the static files show up on browser refresh.
      - ./front-end/public:/usr/share/nginx/html:ro
      - ./front-end/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - portfolio
    restart: unless-stopped

volumes:
  redis-data:
  postgres-data:
  portfolio-backups:
  screener-raw:
